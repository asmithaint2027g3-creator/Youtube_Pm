<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowV3" cx="70%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowV3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGlowV3)"/>

  <!-- Architectural Subtle Grid -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Series Kicker Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="20" cy="21" r="6" fill="#10b981"/>
    <text x="36" y="27" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="0.15em">
      PROFITMACHINES BRIEFING 03
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 220)" filter="url(#shadowV3)">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="74" fill="#f8fafc" letter-spacing="-0.03em">
      THE <tspan fill="url(#emeraldAccent)">90-DAY</tspan>
    </text>
    <text y="88" font-family="'Inter', sans-serif" font-weight="900" font-size="74" fill="#f8fafc" letter-spacing="-0.03em">
      REVENUE ROADMAP
    </text>
  </g>

  <!-- Value Sub-banner -->
  <g transform="translate(80, 385)">
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="24" fill="#94a3b8" letter-spacing="0.01em">
      CFO-Audited Blueprint • Phase Gates • Compounding IRR
    </text>
  </g>

  <!-- Right Visual Stage: 90-Day Execution Matrix -->
  <g transform="translate(740, 140)" filter="url(#shadowV3)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="460" height="460" rx="20" fill="url(#cardGlow)" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Header -->
    <rect x="0" y="0" width="460" height="56" rx="20" fill="#0f172a" opacity="0.8"/>
    <text x="30" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="0.12em">
      EXECUTION TIMELINE &amp; PHASE GATES
    </text>
    <circle cx="420" cy="28" r="5" fill="#10b981"/>

    <!-- Phase 1 Row -->
    <g transform="translate(25, 80)">
      <rect x="0" y="0" width="410" height="85" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="15" y="16" width="95" height="26" rx="6" fill="#1e293b"/>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">DAYS 1–30</text>
      <text x="125" y="34" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Telemetry &amp; Audit</text>
      <text x="15" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Baseline friction index &amp; dark funnel telemetry</text>
      <circle cx="390" cy="29" r="8" fill="#10b981" opacity="0.2"/>
      <circle cx="390" cy="29" r="4" fill="#10b981"/>
    </g>

    <!-- Phase 2 Row -->
    <g transform="translate(25, 180)">
      <rect x="0" y="0" width="410" height="85" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="15" y="16" width="95" height="26" rx="6" fill="#1e293b"/>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#60a5fa">DAYS 31–60</text>
      <text x="125" y="34" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Pilot Orchestration</text>
      <text x="15" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Deploy Autonomous SDRs &amp; intent ingestion</text>
      <circle cx="390" cy="29" r="8" fill="#38bdf8" opacity="0.2"/>
      <circle cx="390" cy="29" r="4" fill="#38bdf8"/>
    </g>

    <!-- Phase 3 Row -->
    <g transform="translate(25, 280)">
      <rect x="0" y="0" width="410" height="85" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="15" y="16" width="95" height="26" rx="6" fill="#1e293b"/>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399">DAYS 61–90</text>
      <text x="125" y="34" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Full Scale &amp; Governance</text>
      <text x="15" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Continuous expansion &amp; board-level telemetry</text>
      <circle cx="390" cy="29" r="8" fill="#34d399" opacity="0.2"/>
      <circle cx="390" cy="29" r="4" fill="#34d399"/>
    </g>

    <!-- Bottom Financial Metric -->
    <g transform="translate(25, 385)">
      <rect x="0" y="0" width="410" height="52" rx="10" fill="#064e3b" opacity="0.4" stroke="#059669" stroke-width="1"/>
      <text x="20" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">CFO Metric:</text>
      <text x="110" y="33" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#34d399">148% Projected IRR • 4.2-mo Payback</text>
    </g>
  </g>

  <!-- Bottom Badges / Trust Markers -->
  <g transform="translate(80, 570)">
    <rect x="0" y="0" width="220" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
      3 Phase Gates
    </text>
    <rect x="235" y="0" width="240" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="255" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
      Deterministic ROI
    </text>
    <rect x="490" y="0" width="220" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="510" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#10b981">
      Enterprise SLA
    </text>
  </g>

  <!-- ProfitMachines Brand Attribution Bottom Right -->
  <g transform="translate(1040, 640)">
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#64748b" letter-spacing="0.1em">
      PROFITMACHINES
    </text>
    <rect x="150" y="16" width="8" height="8" rx="2" fill="#38bdf8"/>
  </g>
</svg>
