<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGlow)"/>

  <!-- Subtle Architectural Grid -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Series Kicker Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="20" cy="21" r="6" fill="#38bdf8"/>
    <text x="36" y="27" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="0.15em">
      PROFITMACHINES BRIEFING 01
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="78" fill="#f8fafc" letter-spacing="-0.03em" line-height="1">
      THE <tspan fill="url(#redAccent)">$17M</tspan>
    </text>
    <text y="90" font-family="'Inter', sans-serif" font-weight="900" font-size="78" fill="#f8fafc" letter-spacing="-0.03em">
      PIPELINE LEAK
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="80" y="375" font-family="'Inter', sans-serif" font-weight="600" font-size="28" fill="#94a3b8" letter-spacing="-0.01em">
    Why Hiring More Sales Reps &amp; Stacking SaaS Tools Fails
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 430)">
    <!-- Badge 1: Slippage -->
    <g transform="translate(0, 0)">
      <rect width="180" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#ef4444">67%</text>
      <text x="18" y="72" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#94a3b8">DEALS SLIP QUARTER</text>
    </g>

    <!-- Badge 2: Selling Time -->
    <g transform="translate(200, 0)">
      <rect width="180" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#f59e0b">&lt; 33%</text>
      <text x="18" y="72" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#94a3b8">TIME SPENT SELLING</text>
    </g>

    <!-- Badge 3: Cost of Inaction -->
    <g transform="translate(400, 0)">
      <rect width="210" height="90" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#f8fafc">$17.18M</text>
      <text x="18" y="72" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#ef4444">ANNUAL COST OF INACTION</text>
    </g>
  </g>

  <!-- Right Side Visual: Leaking Revenue Funnel Schematic -->
  <g transform="translate(760, 140)" filter="url(#shadow)">
    <!-- Glassmorphic Card Container -->
    <rect width="440" height="490" rx="24" fill="#0b132b" fill-opacity="0.85" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="24" y="24" width="392" height="40" rx="8" fill="#0f172a"/>
    <text x="44" y="50" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="0.1em">
      GTM FRICTION FORENSICS: $100M ARR
    </text>

    <!-- Leaking Funnel Illustration -->
    <path d="M 50 100 L 390 100 L 280 250 L 280 400 L 160 400 L 160 250 Z" fill="none" stroke="#334155" stroke-width="4"/>
    
    <!-- Inflow Stream -->
    <rect x="175" y="115" width="90" height="20" rx="4" fill="#38bdf8" opacity="0.8"/>
    <text x="220" y="130" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#020617" text-anchor="middle">INBOUND PIPELINE</text>

    <!-- Fracture 1: Signal Latency -->
    <line x1="335" y1="175" x2="415" y2="175" stroke="#ef4444" stroke-width="3" stroke-dasharray="4"/>
    <circle cx="335" cy="175" r="5" fill="#ef4444"/>
    <text x="415" y="170" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ef4444" text-anchor="end">SIGNAL LATENCY: -$7.84M</text>

    <!-- Fracture 2: Single-Threading -->
    <line x1="105" y1="210" x2="25" y2="210" stroke="#ef4444" stroke-width="3" stroke-dasharray="4"/>
    <circle cx="105" cy="210" r="5" fill="#ef4444"/>
    <text x="25" y="205" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ef4444">COMMITTEE VETOES</text>

    <!-- Fracture 3: Rep Drag -->
    <line x1="280" y1="310" x2="380" y2="310" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4"/>
    <circle cx="280" cy="310" r="5" fill="#f59e0b"/>
    <text x="380" y="305" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b" text-anchor="end">ADMIN DRAG: -$4.12M</text>

    <!-- Outflow Pool -->
    <rect x="140" y="415" width="160" height="45" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="220" y="442" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">NET CLOSED: 33%</text>
  </g>

  <!-- Pinned Mandatory Disclaimer at Bottom -->
  <text x="80" y="660" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748b">
    *Illustrative financial model based on a representative $100M ARR enterprise profile; actual financial results vary based on customer contract structures, gross margin profiles, and operational adoption.
  </text>
</svg>

