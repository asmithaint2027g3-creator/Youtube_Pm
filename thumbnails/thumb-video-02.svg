<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowV2" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadowV2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGlowV2)"/>

  <!-- Subtle Architectural Grid -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Series Kicker Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="20" cy="21" r="6" fill="#60a5fa"/>
    <text x="36" y="27" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="0.15em">
      PROFITMACHINES BRIEFING 02
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 220)" filter="url(#shadowV2)">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="74" fill="#f8fafc" letter-spacing="-0.03em">
      BEYOND <tspan fill="url(#cyanAccent)">AI CHATBOTS</tspan>
    </text>
    <text y="90" font-family="'Inter', sans-serif" font-weight="900" font-size="64" fill="#f8fafc" letter-spacing="-0.03em">
      THE REVENUE ENGINE
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="80" y="375" font-family="'Inter', sans-serif" font-weight="600" font-size="28" fill="#94a3b8" letter-spacing="-0.01em">
    How 8 Connected Capabilities Turn Chaos into Compounding ARR
  </text>

  <!-- Capability Highlights Row -->
  <g transform="translate(80, 430)">
    <g transform="translate(0, 0)">
      <rect width="180" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="30" fill="#38bdf8">3-TIER</text>
      <text x="18" y="72" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#94a3b8">ARCHITECTURE</text>
    </g>

    <g transform="translate(200, 0)">
      <rect width="180" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="30" fill="#10b981">+62.5%</text>
      <text x="18" y="72" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#94a3b8">SALES VELOCITY LIFT</text>
    </g>

    <g transform="translate(400, 0)">
      <rect width="210" height="90" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
      <text x="18" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="30" fill="#f8fafc">ZERO-DATA</text>
      <text x="18" y="72" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#60a5fa">RETENTION &amp; TRUST</text>
    </g>
  </g>

  <!-- Right Side Visual: 3D Exploded Architecture Diagram -->
  <g transform="translate(760, 130)" filter="url(#shadowV2)">
    <rect width="440" height="500" rx="24" fill="#0b132b" fill-opacity="0.85" stroke="#1e293b" stroke-width="2"/>
    
    <rect x="24" y="24" width="392" height="40" rx="8" fill="#0f172a"/>
    <text x="44" y="50" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#60a5fa" letter-spacing="0.1em">
      SYSTEM OF INTELLIGENCE STACK
    </text>

    <!-- Slab 1: Tier 1 Orchestration -->
    <g transform="translate(35, 90)">
      <rect width="370" height="95" rx="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#f8fafc">TIER 1: AI ORCHESTRATION &amp; AGENTS</text>
      <text x="24" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8">Sub-60s Context Dossiers • Dynamic Battlecards</text>
    </g>

    <!-- Bi-directional Connector 1 -->
    <line x1="220" y1="190" x2="220" y2="215" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>

    <!-- Slab 2: Tier 2 Decision Fabric -->
    <g transform="translate(35, 220)">
      <rect width="370" height="95" rx="16" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
      <text x="24" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#f8fafc">TIER 2: UNIFIED DECISION FABRIC</text>
      <text x="24" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#60a5fa">Entity Resolution • SPICED / MEDDPICC Graphs</text>
    </g>

    <!-- Bi-directional Connector 2 -->
    <line x1="220" y1="320" x2="220" y2="345" stroke="#2563eb" stroke-width="3" stroke-dasharray="4"/>

    <!-- Slab 3: Tier 3 Systems of Record -->
    <g transform="translate(35, 350)">
      <rect width="370" height="95" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
      <text x="24" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#94a3b8">TIER 3: SYSTEMS OF RECORD</text>
      <text x="24" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748b">Salesforce CRM • HubSpot • NetSuite ERP</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="80" y="660" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.1em">
    DETERMINISTIC GATES • ZERO CLIENT DATA RETENTION • CONTINUOUS FINOPS
  </text>
</svg>

